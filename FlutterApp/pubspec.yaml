name: safesim
description: "SafeSim - Offline-first industrial safety training platform for mining, steel, and manufacturing workers."
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation & State
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  
  # UI & Design
  flutter_animate: ^4.5.2
  
  # QR Code & Scanning
  mobile_scanner: 6.0.11
  qr_flutter: ^4.1.0
  
  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.3
  
  # Local Storage & Offline Database
  sqflite: ^2.4.1
  sqflite_common_ffi_web: 1.2.0
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/certificates/
